name: Extension bug
description: Report a reproducible problem in the reference extension
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: botnexus-revision
    attributes:
      label: BotNexus revision
      description: Commit SHA or release used to build the extension.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact build, configuration, and invocation steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
